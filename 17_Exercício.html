<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=g, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Nota 1</p>
    <input type="nuber" name=" " id="nota1">
    <p>Nota 2</p>
    <input type="nuber" name=" " id="nota1">
    <p>Nota 3</p>
    <input type="nuber" name=" " id="nota3">
    <button>Calcular</button>
    <p id="resultado"></p>
    <script>
        let nota1 = document.querySelector('#nota1');
        let nota2 = document.querySelector('#nota2');
        let nota3 = document.querySelector('#nota3');
        let button = document.querySelector('button');
        let resultado = document.querySelector('#resultado');
        button.addEventListener('click',function(){
            let media = Number(nota1.value) + Number(nota2.value) + Number(nota3.value)/3;
            if(media < 5){
            resultado.textContent = media + ' reprovado ';
            } else if(media >= 5 && media < 7){
            resultado.textContent = media + ' em recuperação ';
            } else {
            resultado.textContent = media + ' aprovado ';
            }
        });
    </script>
</body>
</html>
