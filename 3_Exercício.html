<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>
    <p>digite um numero</p>
     <input type="number" name="" id="caixa">
     <p id="resultado"></p>
     <script>
     
        let caixa = document.querySelector("#caixa");
        let resultado = document.querySelector("#resultado");
        caixa.addEventListener("change", function(){
            if(this.value % 2 == 0 && this.value != ''){
                resultado.textContent = this.value + ' é par.'
            } 
             else if(this.value % 2 != 0){
                resultado.textContent = this.value + ' é impar.'
             }
                else{
                    resultado.textContent ='Está vazio.'
                }
             
             }
        )
        </script>
</body>
</html>
